syntax = "proto3";

package cash.z.wallet.sdk.rpc;

service CompactTxStreamer {
  rpc GetLightdInfo(Empty) returns (LightdInfo);
  rpc GetLatestBlock(ChainSpec) returns (BlockID);
  rpc GetBlock(BlockID) returns (CompactBlock);
  rpc GetBlockRange(BlockRange) returns (stream CompactBlock);
  rpc GetTaddressBalance(AddressList) returns (Balance);
}

message Empty {}

message ChainSpec {}

message BlockID {
  uint64 height = 1;
  bytes hash = 2;
}

message BlockRange {
  BlockID start = 1;
  BlockID end = 2;
  repeated PoolType poolTypes = 3;
}

enum PoolType {
  POOL_TYPE_UNKNOWN = 0;
  POOL_TYPE_TRANSPARENT = 1;
  POOL_TYPE_SAPLING = 2;
  POOL_TYPE_ORCHARD = 3;
}

message AddressList {
  repeated string addresses = 1;
}

message Balance {
  uint64 valueZat = 1;
}

message LightdInfo {
  string version = 1;
  string vendor = 2;
  bool taddrSupport = 3;
  string chainName = 4;
  uint64 saplingActivationHeight = 5;
  string consensusBranchId = 6;
  uint64 blockHeight = 7;
  string zcashdBuild = 8;
  string zcashdSubversion = 9;
  string donationAddress = 10;
  uint64 estimatedHeight = 11;
  string branch = 12;
  string buildDate = 13;
  string buildUser = 14;
  string upgradeName = 15;
  uint64 upgradeHeight = 16;
}

message ChainMetadata {
  uint64 saplingCommitmentTreeSize = 1;
  uint64 orchardCommitmentTreeSize = 2;
}

message CompactTx {
  uint64 index = 1;
  bytes txid = 2;
}

message CompactBlock {
  uint64 height = 1;
  bytes hash = 2;
  bytes prevHash = 3;
  uint64 time = 4;
  repeated CompactTx vtx = 5;
  ChainMetadata chainMetadata = 6;
}